# Troque "app" por um nome unico seu (letras minusculas e hifens) antes do primeiro deploy.
app = "agenda-giselle-troque"
primary_region = "gru"   # Sao Paulo

[build]

[env]
  PORT = "3000"
  TZ = "America/Sao_Paulo"
  NODE_ENV = "production"

[mounts]
  source = "agenda_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # o agente precisa ficar sempre ligado para disparar os lembretes
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
