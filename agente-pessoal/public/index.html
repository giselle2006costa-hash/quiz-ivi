<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Agenda</title>
<style>
  :root { --bg:#faf8f5; --fg:#222; --muted:#777; --card:#fff; --line:#e5e0d8; --acc:#3b6e5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181a; --fg:#eee; --muted:#9a9a9a; --card:#202326; --line:#33373b; --acc:#6fb59c; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:24px 0 8px; }
  form, .item, pre { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  form { display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  form .full { grid-column:1/-1; }
  input, select, button { font:inherit; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); width:100%; }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); width:auto; padding:4px 10px; font-weight:400; }
  .item { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .item.done .t { text-decoration:line-through; color:var(--muted); }
  .item .t { flex:1; } .item small { color:var(--muted); display:block; }
  .item input[type=checkbox] { width:22px; height:22px; flex:none; }
  pre { white-space:pre-wrap; font:inherit; margin:0; }
  #status { font-size:.8rem; color:var(--muted); }
  #login { display:none; }
  form.quick { grid-template-columns:1fr auto auto; margin-bottom:8px; }
  form.quick button.ghost { padding:9px 12px; font-size:1.1rem; }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--muted); font-size:.9rem; margin-bottom:8px; }
  #qreply, #olbox { margin:8px 0; }
  a { color:var(--acc); }
  .item .acts { display:flex; flex-direction:column; gap:4px; }
  .item.edit { display:block; }
  .edit .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .edit .grid .full { grid-column:1/-1; }
  .edit label { font-size:.75rem; color:var(--muted); display:block; margin-bottom:2px; }
  .edit .btns { display:flex; gap:8px; margin-top:10px; }
  .edit textarea { width:100%; font:inherit; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); min-height:60px; }
</style>
</head>
<body>
<main>
  <h1>Minha Agenda</h1>
  <div id="login"><form onsubmit="return login(event)">
    <input type="text" name="username" value="agenda" autocomplete="username" style="display:none">
    <input class="full" id="tok" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" placeholder="Senha">
    <button class="full" id="lbtn">Entrar</button>
    <p class="full" id="lerr" style="margin:0;color:#b3402d;min-height:1.2em"></p>
    <small id="ver" style="color:var(--muted)"></small>
  </form></div>
  <div id="app" hidden>
    <form id="q" class="quick" onsubmit="return quick(event)">
      <input id="qtext" placeholder="Fale ou escreva: dentista amanhã às 14h" autocomplete="off">
      <button type="button" id="mic" class="ghost" onclick="mic()" title="Falar">🎤</button>
      <button>Enviar</button>
    </form>
    <pre id="qreply" hidden></pre>
    <details><summary>Cadastro detalhado</summary>
    <form id="f" onsubmit="return add(event)">
      <input class="full" name="title" placeholder="O que precisa fazer?" required>
      <input name="start" type="datetime-local" title="Deixe vazio para tarefa sem horario">
      <input name="due" type="date" title="Prazo (tarefa sem horario)">
      <select name="dur"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">1 h</option><option value="120">2 h</option></select>
      <select name="prio"><option value="1">Prioridade alta</option><option value="2" selected>Media</option><option value="3">Baixa</option></select>
      <select name="rem" class="full"><option value="5">Avisar 5 min antes</option><option value="15" selected>Avisar 15 min antes</option><option value="60">Avisar 1 h antes</option></select>
      <button class="full">Adicionar</button>
    </form></details>
    <h2>Plano de hoje</h2><pre id="plan">...</pre>
    <h2>Tudo</h2><div id="list"></div>
    <h2>Anotações</h2><div id="notes"></div>
    <div id="olbox" hidden></div>
    <p id="status"></p>
    <button class="ghost" id="olbtn" onclick="connectOl()" hidden>Conectar Outlook</button>
    <button class="ghost" onclick="testNotify()">Enviar notificacao de teste</button>
    <button class="ghost" onclick="logout()">Sair</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
// A sessao fica num cookie do servidor (dura ~1 ano); nada de senha guardada no navegador.
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function api(method, path, body) {
  for (let attempt = 0; ; attempt++) {
    try {
      const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
      if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('401'); }
      return await r.json();
    } catch (e) {
      // so repete leituras: repetir um cadastro poderia duplicar o item
      if (e.message === '401' || method !== 'GET' || attempt >= 2) throw e;
      await wait(700);
    }
  }
}
function showLogin(msg = '') { $('app').hidden = true; $('login').style.display = 'block'; $('lerr').textContent = msg; }
async function login(e) {
  e.preventDefault();
  const password = $('tok').value;
  if (!password) return false;
  $('lbtn').disabled = true; $('lbtn').textContent = 'Entrando...'; $('lerr').textContent = '';
  try {
    const j = await api('POST', '/login', { password });
    if (j.error) showLogin(j.error === 'senha incorreta' ? 'Senha incorreta.' : 'Muitas tentativas. Tente em 15 minutos.');
    else { $('tok').value = ''; await load(); }
  } catch (_) { showLogin('Não consegui falar com o servidor. Tente de novo.'); }
  $('lbtn').disabled = false; $('lbtn').textContent = 'Entrar';
  return false;
}
async function logout() { try { await api('POST', '/logout'); } catch (_) {} showLogin(); }
const fmt = (i) => i.kind === 'note' ? 'anotação' : i.start_at ? new Date(i.start_at).toLocaleString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
  : (i.due_date ? 'prazo ' + i.due_date.split('-').reverse().join('/') : 'sem data');
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
async function load() {
  const [items, plan, st] = await Promise.all([api('GET', '/items'), api('GET', '/plan'), api('GET', '/status')]);
  if (!Array.isArray(items)) throw new Error('resposta inesperada');
  $('login').style.display = 'none'; $('app').hidden = false;
  $('plan').textContent = plan.text;
  $('status').textContent = `v${st.version} · Push: ${st.push ? 'ativo' : 'desligado'} · WhatsApp: ${st.whatsapp ? 'ativo' : 'desligado'} · Outlook: ${st.outlook ? 'conectado' : 'desligado'}`;
  cache = items;
  if (editing === null) render();
  $('olbtn').hidden = !(st.outlookConfigured && !st.outlook);
  if (!st.outlookConfigured) $('status').textContent += ' (para ligar o Outlook falta MS_CLIENT_ID no servidor)';
  if (st.outlookPending && $('olbox').hidden) showCode(st.outlookPending);
  if (st.outlook) $('olbox').hidden = true;
}
let cache = [], editing = null;
const attr = (s) => esc(s ?? '').replace(/"/g, '&quot;');
const localInput = (iso) => { // ISO UTC -> valor do datetime-local no fuso do aparelho
  if (!iso) return '';
  const d = new Date(iso), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};
const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${+v === +cur ? 'selected' : ''}>${l}</option>`).join('');
function row(i) {
  if (i.id === editing) return editRow(i);
  return `<div class="item ${i.done ? 'done' : ''}">
    <input type="checkbox" ${i.done ? 'checked' : ''} onchange="toggle(${i.id}, this.checked)">
    <div class="t">${esc(i.title)}<small>${fmt(i)}${i.outlook_id ? ' · no Outlook' : ''}${i.notes ? ' · ' + esc(i.notes) : ''}</small></div>
    <div class="acts"><button class="ghost" onclick="edit(${i.id})">editar</button><button class="ghost" onclick="del(${i.id})">apagar</button></div></div>`;
}
function editRow(i) {
  const note = i.kind === 'note';
  return `<form class="item edit" onsubmit="return saveEdit(event, ${i.id})">
    <label>${note ? 'Anotação' : 'Título'}</label><input name="title" value="${attr(i.title)}" required>
    <div class="grid">${note ? '' : `
      <div class="full"><label>Data e hora (deixe vazio para virar tarefa)</label><input name="start" type="datetime-local" value="${localInput(i.start_at)}"></div>
      <div><label>Prazo (tarefa sem hora)</label><input name="due" type="date" value="${attr(i.due_date)}"></div>
      <div><label>Duração</label><select name="dur">${opts([[15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '1 h'], [90, '1h30'], [120, '2 h']], i.duration_min)}</select></div>
      <div><label>Prioridade</label><select name="prio">${opts([[1, 'Alta'], [2, 'Média'], [3, 'Baixa']], i.priority)}</select></div>
      <div><label>Avisar antes</label><select name="rem">${opts([[0, 'Na hora'], [5, '5 min'], [15, '15 min'], [30, '30 min'], [60, '1 h']], i.remind_min)}</select></div>`}
      <div class="full"><label>Detalhes</label><textarea name="notes">${esc(i.notes)}</textarea></div>
    </div>
    <p id="eerr" style="color:#b3402d;margin:8px 0 0"></p>
    <div class="btns"><button>Salvar</button><button type="button" class="ghost" onclick="cancelEdit()">Cancelar</button></div></form>`;
}
function render() {
  $('list').innerHTML = cache.filter((i) => i.kind !== 'note').map(row).join('') || '<p>Nada por aqui ainda.</p>';
  $('notes').innerHTML = cache.filter((i) => i.kind === 'note').map(row).join('') || '<p>Nenhuma anotação.</p>';
}
const edit = (id) => { editing = id; render(); };
const cancelEdit = () => { editing = null; render(); load().catch(() => {}); };
async function saveEdit(e, id) {
  e.preventDefault();
  const f = new FormData(e.target), cur = cache.find((x) => x.id === id);
  const body = { title: f.get('title').trim(), notes: f.get('notes') };
  if (cur.kind !== 'note') {
    Object.assign(body, { start_at: f.get('start') ? new Date(f.get('start')).toISOString() : null,
      due_date: f.get('due') || null, duration_min: +f.get('dur'), priority: +f.get('prio'), remind_min: +f.get('rem') });
    if (body.start_at) body.due_date = null; // compromisso nao usa prazo
  }
  try {
    const j = await api('PATCH', '/items/' + id, body);
    if (j.error) { $('eerr').textContent = j.error; return false; }
    editing = null; await load();
  } catch (_) { $('eerr').textContent = 'Não consegui salvar. Tente de novo.'; }
  return false;
}
function showCode(j) {
  $('olbox').hidden = false;
  $('olbox').innerHTML = j.error ? esc(j.error)
    : `Abra <a href="${esc(j.verification_uri)}" target="_blank" rel="noopener">${esc(j.verification_uri)}</a> e digite o código <b>${esc(j.user_code)}</b>. Depois volte aqui.`;
}
async function connectOl() { showCode(await api('POST', '/outlook/connect')); }
async function quick(e) {
  e.preventDefault();
  const text = $('qtext').value.trim();
  if (!text) return false;
  $('qreply').hidden = false; $('qreply').textContent = 'Entendendo...';
  try {
    const j = await api('POST', '/quick', { text });
    $('qreply').textContent = j.reply || j.error || 'Erro';
    if (j.items) { $('qtext').value = ''; load(); }
  } catch (_) { $('qreply').textContent = 'Sem conexão.'; }
  return false;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('mic').hidden = true;
function mic() {
  const r = new SR(); r.lang = 'pt-BR'; r.interimResults = false;
  r.onresult = (ev) => { $('qtext').value = ev.results[0][0].transcript; $('q').requestSubmit(); };
  r.onerror = () => { $('qreply').hidden = false; $('qreply').textContent = 'Não consegui ouvir. Use o microfone do teclado.'; };
  r.onend = () => { $('mic').textContent = '🎤'; };
  $('mic').textContent = '…'; r.start();
}
async function add(e) {
  e.preventDefault();
  const f = new FormData($('f'));
  const body = { title: f.get('title'), duration_min: +f.get('dur'), priority: +f.get('prio'), remind_min: +f.get('rem') };
  if (f.get('start')) body.start_at = new Date(f.get('start')).toISOString();
  else if (f.get('due')) body.due_date = f.get('due');
  await api('POST', '/items', body); $('f').reset(); load();
}
const toggle = async (id, done) => { await api('PATCH', '/items/' + id, { done }); load(); };
const del = async (id) => { if (confirm('Apagar?')) { await api('DELETE', '/items/' + id); load(); } };
const testNotify = async () => { await api('POST', '/test-notify'); alert('Enviado.'); };
fetch('/healthz').then((r) => r.json()).then((j) => { $('ver').textContent = 'versão ' + j.version; }).catch(() => {});
load().catch((e) => { if (e.message !== '401') showLogin('Não consegui falar com o servidor. Recarregue a página.'); });
setInterval(() => { if (!$('app').hidden) load().catch(() => {}); }, 60000);
</script>
</body>
</html>
